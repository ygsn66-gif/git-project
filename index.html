<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>

        <div class = "todo-app"> 
            <div class = "title"> Todo App </div>

            <div class = "todo-form">
                <input class = "todo-input" type ="text" placeholder = "Add a todo">
                <div class = "todo-button"> Add Todo </div>
            </div>

            <div class = "item completed">

                <div>
                    <input type = "checkbox" />
                    <span class = "name"> Todo Item </span>
                </div>
                
                <div class = "del"> del</div>
            
            </div>

            <div class = "item">

                <div>
                    <input type = "checkbox" />
                    <span class = "name"> Todo Item </span>
                </div>
                
                <div class = "del"> del</div>
            
            </div>

            <div class = "item">

                <div>
                    <input type = "checkbox" />
                    <span class = "name"> Todo Item </span>
                </div>
                
                <div class = "del"> del</div>
            
            </div>
        </div>

        <style>
            .item {
                width: 80%;
                height: 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 8px auto;
                padding: 16px;
                border-radius: 10px;
                box-shadow: 0px 0px 5px 0px rgb(162, 69, 69);
                box-sizing: border-box;
            }

            .completed {
                text-decoration: line-through;
                opacity: 0.5;
            }

            .del{
                color:red;
            }

            .todo-form {
                width: 100%;
                height: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20px;
            }

            .todo-input {
                width: 50%;
                height: 50px;
                border-radius: 20px 0 0 20px;
                border: 1px solid rgb(162, 69, 69);
            }

            .todo-button {
                width: 100px;
                height: 54px;
                text-align: center;
                line-height: 54px; 
                background: linear-gradient(
                    to right,

                    rgb(90, 174, 143),
                    rgb(25, 25, 197)
                );
                color: white;
                border: none;
                border-radius: 0 20px 20px 0;
                cursor: pointer;
                user-select: none;
            }

            body {
                
                background: linear-gradient(
                    to right,

                    rgb(90, 174, 143),
                    rgb(25, 25, 197)
                );
            }
            
            .todo-app {
                width: 98%;
                height: 600px;
                background-color: white;
                margin: 0 auto;
                margin-top: 100px;
                border-radius: 10px;
            }

            .title {
                text-align: center;
                font-size: 30px;
                font-weight: bold;
                padding-top: 20px;
            }

        </style>
    </body>
</html>
